name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Test server with SQLite
        run: npm test --prefix server
      - name: Test server with PostgreSQL adapter
        run: npm run test:postgres --prefix server
      - name: Audit server runtime dependencies
        run: npm audit --omit=dev --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Test client
        run: npm test --prefix client
      - name: Build client
        run: npm run build --prefix client
      - name: Audit client runtime dependencies
        run: npm audit --omit=dev --prefix client
